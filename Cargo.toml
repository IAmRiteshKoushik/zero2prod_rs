[package]
name = "zero2prod_rs"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zero2prod_rs"
path = "src/main.rs"

[dependencies]
actix-web = "4.14.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
config = { version = "0.14.1", default-features = false, features = ["yaml"] }
env_logger = "0.9.3"
serde = { version = "1.0.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = { version = "0.1.44", features = ["log"] }
uuid = { version = "1.28.0", features = ["v4"] }

[dependencies.sqlx]
version = "0.9.0"
default-features = false
features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"]

[dev-dependencies]
reqwest = "0.11.27"
