[package]
name = "zero2prod_rs"
version = "0.1.0"
edition = "2024"
authors = ["Ritesh Koushik"]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod_rs"

[dependencies]
actix-web = "4.0.0"
anyhow = "1.0.102"
chrono = "0.4.15"
config = "0.11"
env_logger = "0.9"
serde = { version = "1.0.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.11", features = ["v4"] }

[dependencies.sqlx]
version = "0.9.0"
default-features = false
features = [
  "runtime-tokio",
  "tls-rustls",
  "macros",
  "postgres",
  "uuid",
  "chrono",
  "migrate"
]

[dev-dependencies]
reqwest = "0.11"
