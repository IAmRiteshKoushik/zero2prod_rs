[package]
name = "zero2prod_rs"
version = "0.1.0"
edition = "2024"
authors = ["Ritesh Koushik"]

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod_rs"

[dependencies]
actix-web = "4.0.0"
anyhow = "1.0.102"
chrono = "0.4.15"
config = "0.11"
env_logger = "0.9"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "0.8.1", features = ["v4"] }

[dev-dependencies]
reqwest = "0.11"
